[project]
name = "commerce-ops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "gitlint>=0.19.1",
    "httpx2>=2.12.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/agents", "tests/integration"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
