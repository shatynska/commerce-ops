[project]
name = "commerce-ops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Bolt's async app and slack-sdk's AsyncWebClient both need aiohttp, and
    # it is NOT transitive: slack-sdk declares it only under its `optional`
    # extra, so this project carries it directly.
    "aiohttp>=3.13.5,<4",
    # Used to compute the longest gap between consecutive scheduled runs, so
    # a tolerance can be checked against its own schedule rather than against
    # an assumed uniform interval. Declared directly rather than relied on
    # transitively from the job runner, for the reason the aiohttp comment
    # above records: a runner release that drops or renames it would break
    # the check through an unrelated `uv sync`.
    "croniter>=6.0,<7",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    # The Postgres-backed job runner behind the `scheduled-jobs` capability.
    # Major pinned: a minor upgrade may ship schema migrations, and this
    # project vendors the runner's schema into an Alembic revision.
    "procrastinate>=3.9,<4",
    # procrastinate depends on psycopg 3, which arrives WITHOUT a libpq
    # wrapper -- `import procrastinate` then fails with "no pq wrapper
    # available". asyncpg bundles its own, so nothing else here establishes
    # that libpq is present. The binary extra is declared rather than
    # assumed; without it every module importing the runner fails at import,
    # which reads as a broken test suite rather than a missing library.
    "psycopg[binary]>=3.3,<4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0,<7",
    "slack-bolt>=1.30,<2",
    # Floor raised from 3.36 to match slack-bolt 1.30's own `slack_sdk>=3.38`
    # requirement, so the real constraint is declared rather than implicit.
    "slack-sdk>=3.38.0,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "gitlint>=0.19.1",
    "httpx2>=2.12.0",
    "import-linter>=2.13",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "types-PyYAML>=6.0,<7",
    "types-croniter>=6.0,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/agents", "tests/integration"]

[tool.mypy]
strict = true

[tool.ruff.lint.flake8-bugbear]
# fastapi.Depends() as a parameter default is the idiomatic FastAPI
# dependency-injection pattern, not a mutable-default footgun -- B008 only
# recognizes this automatically when the parameter's annotation is a plain
# builtin scalar (int/str/bool/float), not a real type like AsyncSession.
extend-immutable-calls = ["fastapi.Depends"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commerce_ops"]
