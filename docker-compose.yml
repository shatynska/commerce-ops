services:
  app:
    image: ghcr.io/shatynska/commerce-ops:${IMAGE_TAG}
    # The same .env the deploy renders and delivers alongside this file.
    # Compose already reads it for ${IMAGE_TAG}/${POSTGRES_PASSWORD}
    # substitution in this file; this additionally loads its contents into
    # the container's process environment, which is how the application
    # receives its runtime secrets (IMAGE_TAG comes along inertly).
    env_file: .env
    environment:
      # Built from the same POSTGRES_PASSWORD secret .env carries, rather
      # than duplicating a second connection-string secret through the
      # deploy pipeline (see add-products-store's proposal.md - Impact).
      DATABASE_URL: postgresql+asyncpg://commerce_ops:${POSTGRES_PASSWORD}@postgres:5432/commerce_ops
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform_edge
      - app_db
      - app_cron
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.commerce-ops.rule=Host(`fuperia.shatynska.com`)"
      - "traefik.http.routers.commerce-ops.entrypoints=websecure"
      - "traefik.http.routers.commerce-ops.tls.certresolver=letsencrypt"
      - "traefik.http.services.commerce-ops.loadbalancer.server.port=8000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: commerce_ops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: commerce_ops
    volumes:
      - commerce_ops_pgdata:/var/lib/postgresql/data
    ports:
      # Loopback-only: lets `alembic`/`pytest` running directly on the host
      # (not in a container) reach it for local development, per README.md's
      # "Local Postgres" section -- not bound to a public interface, and
      # distinct from the appdb network's container-to-container isolation
      # from platform_edge below.
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Required for `app`'s `depends_on: condition: service_healthy` above
      # to be evaluable at all -- see design.md's Decisions.
      test: ["CMD-SHELL", "pg_isready -U commerce_ops -d commerce_ops"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      # Deliberately not on platform_edge: no HTTP surface, no reason to be
      # reachable from the same network other apps on this host may share.
      - app_db

  cron:
    # add-product-agent-daily-digest: fires the product-monitoring cadence
    # triggers on a schedule. Declared inline (see design.md's Decisions on
    # why: deploy-pipeline only ships docker-compose.yml and .env, never a
    # separate crontab file) rather than a label-driven scheduler -- one
    # image, five plain crontab lines. The crontab is generated at
    # container start from TRIGGER_SECRET (delivered via env_file, same as
    # `app`) so the secret never appears in this file itself; `$$` below is
    # Compose's own escape for a literal `$`, so the substitution happens
    # in the container's shell, not at `docker compose` parse time.
    image: alpine:3.21
    restart: unless-stopped
    env_file: .env
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/crontabs/root <<EOF
        0 6 * * * wget -q -T 10 -O /dev/null --header="Authorization: Bearer $$TRIGGER_SECRET" --post-data= http://app:8000/products/monitoring/daily
        0 7 * * 1 wget -q -T 10 -O /dev/null --header="Authorization: Bearer $$TRIGGER_SECRET" --post-data= http://app:8000/products/monitoring/weekly
        0 7 1,15 * * wget -q -T 10 -O /dev/null --header="Authorization: Bearer $$TRIGGER_SECRET" --post-data= http://app:8000/products/monitoring/biweekly
        0 8 1 * * wget -q -T 10 -O /dev/null --header="Authorization: Bearer $$TRIGGER_SECRET" --post-data= http://app:8000/products/monitoring/monthly
        0 9 1 1,4,7,10 * wget -q -T 10 -O /dev/null --header="Authorization: Bearer $$TRIGGER_SECRET" --post-data= http://app:8000/products/monitoring/quarterly
        EOF
        exec crond -f -l 2
    depends_on:
      - app
    networks:
      # Private to app + cron only -- not platform_edge (cron has no HTTP
      # surface of its own and doesn't need the shared ingress fabric) and
      # not app_db (cron has no reason to reach Postgres directly; see
      # design.md's Decisions on why a future DB-adjacent scheduled task
      # would still go through an app endpoint, not this network).
      - app_cron

networks:
  platform_edge:
    external: true
  app_db:
  app_cron:

volumes:
  commerce_ops_pgdata:
