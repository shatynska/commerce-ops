services:
  app:
    image: ghcr.io/shatynska/commerce-ops:${IMAGE_TAG}
    # The same .env the deploy renders and delivers alongside this file.
    # Compose already reads it for ${IMAGE_TAG}/${POSTGRES_PASSWORD}
    # substitution in this file; this additionally loads its contents into
    # the container's process environment, which is how the application
    # receives its runtime secrets (IMAGE_TAG comes along inertly).
    env_file: .env
    environment:
      # Built from the same POSTGRES_PASSWORD secret .env carries, rather
      # than duplicating a second connection-string secret through the
      # deploy pipeline (see add-products-store's proposal.md - Impact).
      DATABASE_URL: postgresql+asyncpg://commerce_ops:${POSTGRES_PASSWORD}@postgres:5432/commerce_ops
      # Recorded rather than load-bearing: a container with no TZ already
      # runs UTC, and the job runner interprets every schedule in UTC
      # regardless, so this shifts nothing. It makes log timestamps
      # unambiguous and matches them to the schedule, so a reader is not
      # converting between two zones (design.md, "The schedule is
      # interpreted in UTC, and `TZ` is set to UTC to match").
      TZ: UTC
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform_edge
      - app_db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.commerce-ops.rule=Host(`fuperia.shatynska.com`)"
      - "traefik.http.routers.commerce-ops.entrypoints=websecure"
      - "traefik.http.routers.commerce-ops.tls.certresolver=letsencrypt"
      - "traefik.http.services.commerce-ops.loadbalancer.server.port=8000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: commerce_ops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: commerce_ops
    volumes:
      - commerce_ops_pgdata:/var/lib/postgresql/data
    ports:
      # Loopback-only: lets `alembic`/`pytest` running directly on the host
      # (not in a container) reach it for local development, per README.md's
      # "Local Postgres" section -- not bound to a public interface, and
      # distinct from the appdb network's container-to-container isolation
      # from platform_edge below.
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Required for `app`'s `depends_on: condition: service_healthy` above
      # to be evaluable at all -- see design.md's Decisions.
      test: ["CMD-SHELL", "pg_isready -U commerce_ops -d commerce_ops"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      # Deliberately not on platform_edge: no HTTP surface, no reason to be
      # reachable from the same network other apps on this host may share.
      - app_db

  worker:
    # replace-cron-with-job-runner: runs this application's scheduled work.
    # Same image as `app` because it imports the same application code -- a
    # second image would let the two drift. Only the command differs.
    image: ghcr.io/shatynska/commerce-ops:${IMAGE_TAG}
    env_file: .env
    environment:
      # The same construction `app` uses, so one secret still backs both.
      DATABASE_URL: postgresql+asyncpg://commerce_ops:${POSTGRES_PASSWORD}@postgres:5432/commerce_ops
      TZ: UTC
    restart: unless-stopped
    # `preflight` runs here as it does in `app`'s chain: the command override
    # would otherwise drop that step, and a missing
    # PRODUCT_AGENT_MONITORING_CHANNEL_ID would surface as a failed 06:00 job
    # rather than a named report at container start. No `alembic upgrade` --
    # `app` owns migrating, and this service waits for it below.
    #
    # `exec` so the worker becomes PID 1: without it `sh` stays PID 1, SIGTERM
    # never reaches the worker, and neither its engine disposal nor its
    # in-flight job handling ever runs.
    command:
      - /bin/sh
      - -c
      - uv run python -m commerce_ops.preflight && exec uv run python -m commerce_ops.worker
    healthcheck:
      # The image's HEALTHCHECK polls http://localhost:8000/health, which this
      # service does not serve -- inherited unchanged it would report unhealthy
      # for its entire life, poisoning the signal in the very change meant to
      # make a half-up deployment detectable. Whether a worker is running jobs
      # is not answerable by an HTTP probe; answering it properly is
      # report-overdue-scheduled-runs' job, from outside.
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      app:
        # Schema readiness, not HTTP coupling -- the worker never calls `app`.
        # `app`'s command chain runs `alembic upgrade head` and it becomes
        # healthy only once that completes, which is what stops this service
        # crash-looping against a database with no runner schema on first
        # deploy.
        condition: service_healthy
    networks:
      # app_db only: no HTTP surface, so no platform_edge. The runner's queue
      # lives in the same Postgres as the domain data.
      - app_db

networks:
  platform_edge:
    external: true
  app_db:

volumes:
  commerce_ops_pgdata:
