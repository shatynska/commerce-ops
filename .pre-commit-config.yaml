default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check --force-exclude
        language: system
        types: [python]
        stages: [pre-commit]
      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: lint-imports
        name: lint-imports
        entry: uv run lint-imports --config .importlinter
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: pytest-unit
        name: pytest (unit + agents)
        entry: uv run pytest tests/unit tests/agents
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: gitlint
        name: gitlint
        entry: uv run gitlint --staged --msg-filename
        language: system
        stages: [commit-msg]
      - id: pytest-integration
        name: pytest (integration)
        entry: uv run pytest tests/integration
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
