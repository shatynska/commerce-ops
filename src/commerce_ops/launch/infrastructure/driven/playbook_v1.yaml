# Launch playbook — document shape (see launch/infrastructure/driven/playbook_loader.py):
#
# version: str
# gates:
#   - identifier: str
#     position: int              # 1-based, matching the spec's numbered gate list
#     opening: automatic | requires-confirmation
#     metric_conditions:         # optional — authored threshold checks the gate waits on
#       - metric_id: str         # a reference for monitoring to claim later; no
#                                # registry validates it yet (satisfied by human
#                                # attestation until live observation lands)
#         threshold: str         # human-readable description of what must hold
# steps:
#   - identifier: str
#     gate: str                  # a gate identifier
#     discipline: strategy | finance | setup | inventory | creative | listing |
#                 rank | price | ppc | customer | external | traffic
#     scope: product | market
#     timing_anchor:
#       kind: offset             # {days: int}
#            | window            # {start: int, end: int}
#            | open-ended        # {start: int}
#            | recurring         # {cadence: daily | weekly | biweekly | monthly}
#     binding: framework | lesson
#     blocking: bool
#     execution: automated | ai-assisted | human-attested
#     hazard: none | prohibited-tactic | compliance-obligation   # optional, defaults to none
#     rule_policy: str           # optional
#     provenance: str            # optional — a citation, never an identifier
#
# This is the v1 playbook: the eight gates, the metric conditions on the
# three metric-checked gates, and the authored step set — per the
# launch-playbook capability's spec.
#
# The steps below are authored from `docs/reference/product-launch.md`.
# Each step's `identifier` is that document's own row ID and its
# `provenance` is that row's SOURCE citation, so every step traces back to
# exactly one reference row. The document's BUILD THE LISTING area is
# represented completely (all 72 ID-bearing rows — 65 here on `listable`,
# 7 reassigned to the gate their own timing serves); the other seven gates
# carry a representative subset, curated so that every timing-anchor kind,
# every discipline, both hazards and all three execution modes appear.
#
# Rows that restate a condition a gate already authors as a metric
# condition are deliberately absent: one obligation is expressed once.
# Most steps ship without a `rule_policy` on purpose — they appear in the
# undecided-rule-policies report, which is how that outstanding decision
# stays visible rather than looking settled.

version: v1
gates:
  - identifier: commit
    position: 1
    opening: requires-confirmation
  - identifier: order
    position: 2
    opening: requires-confirmation
  - identifier: listable
    position: 3
    opening: automatic
  - identifier: stock-ready
    position: 4
    opening: automatic
    metric_conditions:
      - metric_id: units-fulfillable
        threshold: 60–80 fulfillable units, excluding Vine
  - identifier: live
    position: 5
    opening: automatic
  - identifier: ignition
    position: 6
    opening: automatic
  - identifier: phase-one-complete
    position: 7
    opening: requires-confirmation
    metric_conditions:
      - metric_id: sales-velocity
        threshold: ~10 units/day sustained
      - metric_id: organic-share
        threshold: organic share above 40%
  - identifier: graduated
    position: 8
    opening: requires-confirmation
    metric_conditions:
      - metric_id: tacos
        threshold: TACOS falling
      - metric_id: review-rating
        threshold: rating stable at 4.5
