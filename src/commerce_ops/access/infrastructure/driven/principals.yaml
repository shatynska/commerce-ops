# Principals directory — document shape (see access/infrastructure/driven/principals_loader.py):
#
# principals:
#   - identity: str              # the Slack user id an adapter has established;
#                                # never empty, never padded, declared at most once
#     all_products: true         # EITHER: sees every product, including ones
#                                # registered after a scope is resolved
#     skus:                      # OR: sees exactly the products these SKUs name.
#       - str                    # An empty list is legitimate and grants nothing;
#                                # omitting the key entirely is a fault. A SKU no
#                                # product has confers nothing, and does not fail
#                                # the load — it is a stale line, not a broken file.
#     admin: true                # OPTIONAL (add-playbook-admin-ui): the entry may
#                                # hold the admin surface's write authority.
#                                # Orthogonal to the visibility grant — no grant of
#                                # any shape confers it, and an admin who sees
#                                # nothing is still an admin. Must be a bare YAML
#                                # boolean; a quoted "true", a "yes", or a number
#                                # fails the load naming the entry. Absent means
#                                # not admin-capable.
#
# An entry declares exactly one of `all_products` and `skus`. Declaring both,
# or neither, fails the load — and the directory is validated at startup, so a
# malformed file stops the deploy rather than any asker's resolution.
#
# This ships empty on purpose: an identity listed here is a granted access, so
# every entry arrives through ordinary code review rather than with the build.
# Example of what a reviewed entry looks like:
#
# principals:
#   - identity: U01EXAMPLE
#     all_products: true
#   - identity: U02EXAMPLE
#     skus:
#       - WIDGET-001

principals:
  - identity: U078TC45LHM
    all_products: true
    admin: true
