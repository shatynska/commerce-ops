name: Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

# No manual approval gate here, unlike /infrastructure's platform-deploy.yml
# (production Environment): a bad deploy of this application only affects
# its own container, not the shared platform stack or other applications
# -- see design.md's "Deploy gate" decision. Queue overlapping deploys
# instead of racing them, mirroring platform-deploy.yml's precedent.
concurrency:
  group: deploy-commerce-ops
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # The standing guard for deploy-pipeline's "A Container Starts From Its
      # Image Alone". A failure here fails this job, and `deploy` needs it, so
      # the image never reaches the host.
      #
      # Both probes go through `uv run` deliberately -- the launcher IS the
      # subject of the test. Invoking /app/.venv/bin/python directly would
      # never touch uv and would pass whether or not UV_NO_SYNC is set, which
      # is a guard that cannot fail for the reason it exists. Do not "simplify"
      # it to a direct interpreter call.
      #
      # The positive probe runs with no network at all: if the runtime still
      # tried to sync, it could not, and the import would fail. The negative
      # probe runs WITH the network, because inside --network none an absent
      # index makes `import pytest` fail for the wrong reason -- it must fail
      # because the dev group is not installed, not because PyPI is
      # unreachable.
      - name: Verify the image starts without a package index
        run: |
          set -euo pipefail
          image="${{ env.IMAGE_NAME }}:${{ github.sha }}"

          docker run --rm --network none "$image" \
            sh -c 'uv run python -c "import commerce_ops.worker"'

          if docker run --rm "$image" \
              sh -c 'uv run python -c "import pytest"'; then
            echo "::error::the dev group is installable at runtime; UV_NO_SYNC is not in effect" >&2
            exit 1
          fi

  deploy:
    name: Deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    # Not an approval gate -- this Environment carries no protection rules
    # (confirmed via the GitHub API), consistent with design.md's "no
    # manual approval gate" decision. Declared only because the deploy
    # secrets below are scoped to this Environment, not the repository.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Joins this runner to the same tailnet the host is a member of --
      # SSH is only reachable this way, not over the public internet.
      # `ping` waits for the host to actually become reachable before
      # proceeding, since new tailnet peers propagate with a brief,
      # eventually-consistent delay.
      - name: Connect to the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.DEPLOY_HOST }}

      # Rendered fresh each run -- never committed. IMAGE_TAG comes from
      # the triggering commit's SHA, so docker-compose.yml's
      # `image: ...:${IMAGE_TAG}` resolves against it on the host; the
      # remaining lines are this application's runtime secrets, scoped to
      # the `production` Environment and delivered to the container via
      # docker-compose.yml's `env_file: .env`. POSTGRES_PASSWORD is also
      # read directly by docker-compose.yml's own variable substitution
      # (the postgres service's credentials, and the DATABASE_URL of both
      # `app` and `worker`) -- see add-products-store's proposal.md - Impact.
      # Both services receive the rest via this same rendered file.
      - name: Render .env
        run: |
          umask 077
          {
            echo "IMAGE_TAG=${{ github.sha }}"
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"
            echo "OMNI_AGENT_SLACK_SIGNING_SECRET=${{ secrets.OMNI_AGENT_SLACK_SIGNING_SECRET }}"
            echo "OMNI_AGENT_SLACK_BOT_TOKEN=${{ secrets.OMNI_AGENT_SLACK_BOT_TOKEN }}"
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}"
            echo "PRODUCT_AGENT_SLACK_BOT_TOKEN=${{ secrets.PRODUCT_AGENT_SLACK_BOT_TOKEN }}"
            echo "PRODUCT_AGENT_SLACK_SIGNING_SECRET=${{ secrets.PRODUCT_AGENT_SLACK_SIGNING_SECRET }}"
            echo "PRODUCT_AGENT_MONITORING_CHANNEL_ID=${{ secrets.PRODUCT_AGENT_MONITORING_CHANNEL_ID }}"
            # The completion loop's three variables, registered as
            # `production` secrets since 2026-08-23 but never rendered until
            # now. Nothing else sets them on the host, and both services read
            # them from this file: absent, the reconciliation pass raises
            # `ClickUpSyncError` on the first launch that needs a list and
            # fails every run thereafter, while the webhook rejects every
            # delivery. Neither is visible at startup, because
            # `settings.py` declares all three optional -- see
            # docs/deferred-work.md, "The ClickUp variables are optional".
            echo "CLICKUP_API_TOKEN=${{ secrets.CLICKUP_API_TOKEN }}"
            echo "CLICKUP_LAUNCH_FOLDER_ID=${{ secrets.CLICKUP_LAUNCH_FOLDER_ID }}"
            echo "CLICKUP_WEBHOOK_SECRET=${{ secrets.CLICKUP_WEBHOOK_SECRET }}"
            # The admin surface's public URL (add-playbook-admin-ui):
            # composes the /playbook-admin magic links, and its https
            # scheme turns on the session cookie's Secure flag. Declared
            # optional in settings.py -- absent, the command refuses every
            # caller (fail-closed), which is why it must be rendered here.
            echo "ADMIN_BASE_URL=${{ secrets.ADMIN_BASE_URL }}"
            # A repository/Environment variable, not a secret: the
            # threshold is not sensitive, and masking it in logs would
            # serve nothing. No LOG_LEVEL variable exists yet, so this
            # renders INFO until one is created under Settings -> Secrets
            # and variables -> Actions -> Variables; a change there takes
            # effect on the next deploy, since .env is re-rendered only
            # then (configure-application-logging's design.md, "Deliver
            # LOG_LEVEL through deploy.yml").
            echo "LOG_LEVEL=${{ vars.LOG_LEVEL || 'INFO' }}"
          } >.env

      # COMMERCE_OPS_DEPLOY_SSH_KEY is this application's own forced-command
      # key, provisioned in /infrastructure's add-per-app-deploy-keys (its
      # deploy_apps entry for commerce-ops) -- generated out-of-band there,
      # not here.
      - name: Set up the deploy SSH key
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.COMMERCE_OPS_DEPLOY_SSH_KEY }}" >~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >>~/.ssh/known_hosts

      # One SSH session carries both the content and the trigger: this
      # key's `authorized_keys` entry is restricted to the forced command
      # `deploy-receive commerce-ops`, which overrides any command sent
      # over the session -- a separate scp plus separate ssh trigger would
      # not work against that restriction. `deploy-receive` extracts
      # docker-compose.yml/.env into /opt/commerce-ops and triggers
      # `sudo app-deploy commerce-ops` (docker compose pull && up -d
      # --wait) within this one connection.
      - name: Deliver docker-compose.yml and .env, and trigger the deploy
        run: |
          tar -czf - docker-compose.yml .env | \
            ssh -i ~/.ssh/deploy_key "deploy@${{ secrets.DEPLOY_HOST }}"

      # docker compose up -d --wait (inside app-deploy, triggered above)
      # already fails loudly if the container never becomes healthy --
      # this step is the independent, outside-the-container check: it
      # catches anything that layer wouldn't, e.g. Traefik routing/DNS
      # issues. See design.md's Migration Plan.
      - name: Verify the public health endpoint
        run: |
          for _ in $(seq 1 10); do
            if curl -fsS "https://fuperia.shatynska.com/health"; then
              exit 0
            fi
            sleep 3
          done
          echo "Health check did not succeed after retries" >&2
          exit 1
