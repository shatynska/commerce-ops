name: CI

on:
  pull_request:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    # A gate that can hang is not a gate. The stall this ceiling was added
    # for is fixed (`isolate-tests-from-the-shared-runner`, 2026-08-25), but
    # the ceiling stays: the library behaviours behind it are unfixed --
    # a cancelled task touching the connection pool can survive its own
    # cancellation, and an uncancellable task stops its event loop closing at
    # all, so nothing inside the process can bound it. See the surviving
    # entry in docs/deferred-work.md. Generous against the tier's ~15s,
    # tight against a hang.
    timeout-minutes: 15

    services:
      # The database the integration tier runs against. Ephemeral and
      # reachable only from this job, so it needs no repository secret
      # and is not a connection to the deploy host. Same image the
      # compose file runs, so the tier meets the Postgres it will meet
      # in production.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: commerce_ops
          POSTGRES_PASSWORD: ci-only-not-a-secret
          # Named for the suffix two integration modules check. They rewrite
          # the stored step set, so each refuses any database whose name does
          # not end `_test` -- and with this service named `commerce_ops` they
          # refused this one, skipping five tests on every run while the job
          # reported a pass. The database is created by this service and
          # reachable only from this job, so the name costs nothing.
          POSTGRES_DB: commerce_ops_test
        ports:
          - 5432:5432
        # `psql ... -c 'select 1'` rather than `pg_isready`: `PQpingParams`
        # reports OK whenever the server answers the startup packet, an
        # unknown database included, so `pg_isready -d` calls the service
        # healthy after a misspelt POSTGRES_DB and fails several steps later
        # at `alembic upgrade head` instead. A present-but-misnamed database
        # failing quietly is the fault this change was written to make loud.
        options: >-
          --health-cmd "psql -U commerce_ops -d commerce_ops_test -c 'select 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://commerce_ops:ci-only-not-a-secret@localhost:5432/commerce_ops_test
      # No database here is a failure, not a skip: a gate must not report
      # success for a tier it never ran. It also arms the no-skip guard in
      # `tests/conftest.py` over `tests/integration`, so a *test* that
      # declines to run fails the job too -- this variable being blind to
      # that on its own, since it fires only when no URL resolves and one
      # resolves here.
      COMMERCE_OPS_REQUIRE_DATABASE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check

      - name: ruff format --check
        run: uv run ruff format --check

      - name: mypy
        run: uv run mypy .

      - name: lint-imports
        run: uv run lint-imports --config .importlinter

      - name: pytest (unit + agents)
        run: uv run pytest tests/unit tests/agents

      # The tier assumes the schema and seed are already applied -- every
      # file in it says so -- so these run before it, not inside it.
      - name: alembic upgrade head
        run: uv run alembic upgrade head

      # Seeding is two steps, not one, and running only the first left CI
      # testing a state no deployment ever serves. The migration writes the
      # 97 rows it always did; `seed-the-reference-step-set` put the other
      # 255 behind `seed_playbook`, which the container runs on every start
      # (see the Dockerfile's CMD chain) rather than as a migration. Without
      # it the integration tier sees a step set with no drafts at all, so
      # any obligation on the delivered set passes vacuously or fails for
      # the wrong reason.
      #
      # It adds only rows no stored step already names, so running it here
      # is idempotent and cannot overwrite what the migration wrote.
      - name: seed-playbook
        run: uv run python -m commerce_ops.seed_playbook

      - name: pytest (integration)
        run: uv run pytest tests/integration
